<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 446.97" width="400" height="446.97" role="img" aria-label="The cardiac cycle" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, &#39;Helvetica Neue&#39;, Arial, sans-serif"><title>The cardiac cycle</title><desc>The five phases of the cardiac cycle in order: atrial systole, isovolumetric contraction, ventricular ejection, isovolumetric relaxation and passive ventricular filling, then round again.</desc><rect x="0" y="0" width="400" height="446.97" fill="#ffffff"/><text x="14" y="28.63" font-size="15" fill="#1d232b" font-weight="700">The cardiac cycle</text><g transform="translate(0 40.75)"><path d="M263.07 66.88A128 147.36 0 0 1 291.07 91.56" fill="none" stroke="#5b6573" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="296.81,98.71 286.54,94.29 294.18,87.84" fill="#5b6573" stroke-linejoin="round"/><path d="M327.91 200.66A128 147.36 0 0 1 317.05 254.75" fill="none" stroke="#5b6573" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="313.5,263.24 312.49,252.11 321.8,255.76" fill="#5b6573" stroke-linejoin="round"/><path d="M212.05 341.82A128 147.36 0 0 1 197.15 342.43" fill="none" stroke="#5b6573" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="187.95,341.82 198.14,337.2 197.76,347.19" fill="#5b6573" stroke-linejoin="round"/><path d="M86.5 263.24A128 147.36 0 0 1 72.64 209.78" fill="none" stroke="#5b6573" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="72.09,200.66 77.89,210.22 67.92,211.04" fill="#5b6573" stroke-linejoin="round"/><path d="M103.19 98.71A128 147.36 0 0 1 129.51 72.11" fill="none" stroke="#5b6573" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="136.93,66.88 131.9,76.86 125.92,68.84" fill="#5b6573" stroke-linejoin="round"/><text x="200" y="200.01" font-size="14" fill="#1d232b" text-anchor="middle" font-weight="700">Cardiac cycle</text><rect x="142" y="2" width="116" height="91.5" rx="8" fill="#f4f6f9" stroke="#9aa5b4" stroke-width="1.3"/><text x="200" y="36.88" font-size="12.5" fill="#1d232b" text-anchor="middle" font-weight="700">Atrial systole</text><text x="200" y="54.04" font-size="11" fill="#5b6573" text-anchor="middle">Atria top up</text><text x="200" y="67.79" font-size="11" fill="#5b6573" text-anchor="middle">the ventricles</text><rect x="263.74" y="103.82" width="116" height="91.5" rx="8" fill="#fbe1dc" stroke="#d1432f" stroke-width="1.3"/><text x="321.74" y="130.89" font-size="12.5" fill="#1d232b" text-anchor="middle" font-weight="700">Isovolumetric</text><text x="321.74" y="146.51" font-size="12.5" fill="#1d232b" text-anchor="middle" font-weight="700">contraction</text><text x="321.74" y="163.67" font-size="11" fill="#5b6573" text-anchor="middle">AV valves</text><text x="321.74" y="177.42" font-size="11" fill="#5b6573" text-anchor="middle">close (S1)</text><rect x="217.24" y="268.58" width="116" height="91.5" rx="8" fill="#f4f6f9" stroke="#9aa5b4" stroke-width="1.3"/><text x="275.24" y="288.76" font-size="12.5" fill="#1d232b" text-anchor="middle" font-weight="700">Ventricular</text><text x="275.24" y="304.39" font-size="12.5" fill="#1d232b" text-anchor="middle" font-weight="700">ejection</text><text x="275.24" y="321.55" font-size="11" fill="#5b6573" text-anchor="middle">Aortic and</text><text x="275.24" y="335.3" font-size="11" fill="#5b6573" text-anchor="middle">pulmonary</text><text x="275.24" y="349.05" font-size="11" fill="#5b6573" text-anchor="middle">valves open</text><rect x="66.76" y="268.58" width="116" height="91.5" rx="8" fill="#fbe1dc" stroke="#d1432f" stroke-width="1.3"/><text x="124.76" y="295.64" font-size="12.5" fill="#1d232b" text-anchor="middle" font-weight="700">Isovolumetric</text><text x="124.76" y="311.26" font-size="12.5" fill="#1d232b" text-anchor="middle" font-weight="700">relaxation</text><text x="124.76" y="328.43" font-size="11" fill="#5b6573" text-anchor="middle">Semilunar valves</text><text x="124.76" y="342.18" font-size="11" fill="#5b6573" text-anchor="middle">close (S2)</text><rect x="20.26" y="103.82" width="116" height="91.5" rx="8" fill="#f4f6f9" stroke="#9aa5b4" stroke-width="1.3"/><text x="78.26" y="145.57" font-size="12.5" fill="#1d232b" text-anchor="middle" font-weight="700">Passive filling</text><text x="78.26" y="162.74" font-size="11" fill="#5b6573" text-anchor="middle">AV valves open</text></g></svg>