<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 469.13" width="400" height="469.13" role="img" aria-label="Anaphylaxis: first steps" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, &#39;Helvetica Neue&#39;, Arial, sans-serif"><title>Anaphylaxis: first steps</title><desc>Algorithm: give IM adrenaline, then call for help, lie flat, oxygen and fluids; reassess after 5 minutes and repeat adrenaline until improving, then observe.</desc><rect x="0" y="0" width="400" height="469.13" fill="#ffffff"/><text x="14" y="28.63" font-size="15" fill="#1d232b" font-weight="700">Anaphylaxis: first steps</text><g transform="translate(0 40.75)"><path d="M132.5 51.25L132.5 74.26" fill="none" stroke="#5b6573" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="132.5,81.25 128.13,72.51 136.87,72.51" fill="#5b6573" stroke-linejoin="round"/><path d="M132.5 146.13L132.5 169.13" fill="none" stroke="#5b6573" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="132.5,176.13 128.13,167.39 136.87,167.39" fill="#5b6573" stroke-linejoin="round"/><path d="M252.07 113.69L222.07 113.69" fill="none" stroke="#9aa5b4" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 3"/><path d="M132.5 225.38L132.5 248.38" fill="none" stroke="#5b6573" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="132.5,255.38 128.13,246.64 136.87,246.64" fill="#5b6573" stroke-linejoin="round"/><path d="M206.27 280L235.82 280" fill="none" stroke="#5b6573" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="242.82,280 234.08,284.37 234.08,275.63" fill="#5b6573" stroke-linejoin="round"/><path d="M132.5 304.63L132.5 334.38" fill="none" stroke="#5b6573" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="132.5,341.38 128.13,332.64 136.87,332.64" fill="#5b6573" stroke-linejoin="round"/><path d="M56.76 366L47.76 366Q40.76 366 40.76 359L40.76 285.49Q40.76 280 46.25 280L51.74 280" fill="none" stroke="#5b6573" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="58.73,280 49.99,284.37 49.99,275.63" fill="#5b6573" stroke-linejoin="round"/><rect x="14.5" y="2" width="236" height="49.25" rx="17" fill="#e6ebf2" stroke="#1d232b" stroke-width="1.4"/><text x="132.5" y="23.19" font-size="12.5" fill="#1d232b" text-anchor="middle" font-weight="700">Suspected anaphylaxis: airway,</text><text x="132.5" y="38.81" font-size="12.5" fill="#1d232b" text-anchor="middle" font-weight="700">breathing or circulation problem</text><rect x="42.93" y="81.25" width="179.14" height="64.88" rx="6" fill="#f8d9d5" stroke="#c0392b" stroke-width="1.2"/><text x="132.5" y="102.44" font-size="12.5" fill="#1d232b" text-anchor="middle">IM adrenaline 10</text><text x="132.5" y="118.06" font-size="12.5" fill="#1d232b" text-anchor="middle">micrograms/kg (1 mg/mL),</text><text x="132.5" y="133.69" font-size="12.5" fill="#1d232b" text-anchor="middle">anterolateral thigh</text><rect x="252.07" y="93.31" width="133.4" height="40.75" rx="4" fill="#ffffff" stroke="#9aa5b4" stroke-width="1" stroke-dasharray="3 2"/><text x="318.77" y="110.53" font-size="11.5" fill="#5b6573" text-anchor="middle" font-style="italic">Maximum 500</text><text x="318.77" y="124.9" font-size="11.5" fill="#5b6573" text-anchor="middle" font-style="italic">micrograms per dose</text><rect x="33.79" y="176.13" width="197.41" height="49.25" rx="6" fill="#f4f6f9" stroke="#9aa5b4" stroke-width="1.2"/><text x="132.5" y="197.31" font-size="12.5" fill="#1d232b" text-anchor="middle">Call for help, lie flat, high-flow</text><text x="132.5" y="212.94" font-size="12.5" fill="#1d232b" text-anchor="middle">oxygen, IV fluid 10 mL/kg</text><polygon points="58.73,280 71.73,255.38 193.27,255.38 206.27,280 193.27,304.63 71.73,304.63" fill="#d6e6f5" stroke="#1f6fb2" stroke-width="1.4" stroke-linejoin="round"/><text x="132.5" y="276.56" font-size="12.5" fill="#1d232b" text-anchor="middle" font-weight="700">Improving after</text><text x="132.5" y="292.19" font-size="12.5" fill="#1d232b" text-anchor="middle" font-weight="700">5 minutes?</text><rect x="56.76" y="341.38" width="151.48" height="49.25" rx="6" fill="#f4f6f9" stroke="#9aa5b4" stroke-width="1.2"/><text x="132.5" y="362.56" font-size="12.5" fill="#1d232b" text-anchor="middle">Repeat IM adrenaline</text><text x="132.5" y="378.19" font-size="12.5" fill="#1d232b" text-anchor="middle">every 5 minutes</text><rect x="242.82" y="255.38" width="135.4" height="49.25" rx="17" fill="#d9f0e2" stroke="#1d8a4e" stroke-width="1.4"/><text x="310.52" y="276.56" font-size="12.5" fill="#1d232b" text-anchor="middle" font-weight="700">Observe at least</text><text x="310.52" y="292.19" font-size="12.5" fill="#1d232b" text-anchor="middle" font-weight="700">6 to 12 hours</text><text x="224.54" y="274.98" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700" stroke="#ffffff" stroke-width="3.08" stroke-linejoin="round">Yes</text><text x="224.54" y="274.98" font-size="11" fill="#1d232b" text-anchor="middle" font-weight="700">Yes</text><text x="147.2" y="318.35" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700" stroke="#ffffff" stroke-width="3.08" stroke-linejoin="round">No</text><text x="147.2" y="318.35" font-size="11" fill="#1d232b" text-anchor="middle" font-weight="700">No</text></g><text x="14" y="452.1" font-size="11" fill="#5b6573">Doses after the Resuscitation Council UK 2021 guideline.</text></svg>