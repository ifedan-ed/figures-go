<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 424.22" width="400" height="424.22" role="img" aria-label="Course of Kawasaki disease" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, &#39;Helvetica Neue&#39;, Arial, sans-serif"><title>Course of Kawasaki disease</title><desc>Kawasaki disease: fever and mucocutaneous signs in the acute phase, peeling, high platelets and coronary aneurysms in the subacute phase, then recovery.</desc><rect x="0" y="0" width="400" height="424.22" fill="#16191e"/><text x="14" y="28.63" font-size="15" fill="#e8ecf1" font-weight="700">Course of Kawasaki disease</text><g transform="translate(0 40.75)"><rect x="14" y="5" width="20" height="152.38" rx="5" fill="#1e3447" stroke="#5aa9e6" stroke-width="1"/><g transform="rotate(-90 24 81.19)"><text x="24" y="85.04" font-size="11" fill="#e8ecf1" text-anchor="middle" font-weight="700">Acute</text></g><rect x="14" y="169.38" width="20" height="88" rx="5" fill="#3f3215" stroke="#e7ad3c" stroke-width="1"/><g transform="rotate(-90 24 213.38)"><text x="24" y="217.23" font-size="11" fill="#e8ecf1" text-anchor="middle" font-weight="700">Subacute</text></g><rect x="14" y="269.38" width="20" height="89.1" rx="5" fill="#173a26" stroke="#4cc47f" stroke-width="1"/><g transform="rotate(-90 24 313.92)"><text x="24" y="317.77" font-size="11" fill="#e8ecf1" text-anchor="middle" font-weight="700">Convalescent</text></g><line x1="120.44" y1="13" x2="120.44" y2="277.38" stroke="#6b7684" stroke-width="2" stroke-linecap="round"/><circle cx="120.44" cy="13" r="6" fill="#1e3447" stroke="#5aa9e6" stroke-width="2"/><text x="104.44" y="17.2" font-size="12" fill="#a3adba" text-anchor="end" font-weight="700">Day 1</text><text x="136.44" y="17.69" font-size="12.5" fill="#e8ecf1" font-weight="700">Fever begins</text><text x="136.44" y="34.34" font-size="11.5" fill="#a3adba">High, little response to antipyretics</text><circle cx="120.44" cy="63" r="6" fill="#1e3447" stroke="#5aa9e6" stroke-width="2"/><text x="104.44" y="67.2" font-size="12" fill="#a3adba" text-anchor="end" font-weight="700">Days 2–7</text><text x="136.44" y="67.69" font-size="12.5" fill="#e8ecf1" font-weight="700">Mucocutaneous signs</text><text x="136.44" y="84.34" font-size="11.5" fill="#a3adba">Conjunctivitis, red lips, rash, swollen hands</text><text x="136.44" y="98.71" font-size="11.5" fill="#a3adba">and feet</text><circle cx="120.44" cy="127.38" r="6" fill="#173a26" stroke="#4cc47f" stroke-width="2"/><text x="104.44" y="131.57" font-size="12" fill="#a3adba" text-anchor="end" font-weight="700">By day 10</text><text x="136.44" y="132.06" font-size="12.5" fill="#e8ecf1" font-weight="700">IVIG and aspirin</text><text x="136.44" y="148.71" font-size="11.5" fill="#a3adba">Best given within 10 days of fever onset</text><circle cx="120.44" cy="177.38" r="6" fill="#1e3447" stroke="#5aa9e6" stroke-width="2"/><text x="104.44" y="181.58" font-size="12" fill="#a3adba" text-anchor="end" font-weight="700">Weeks 2–3</text><text x="136.44" y="182.06" font-size="12.5" fill="#e8ecf1" font-weight="700">Peeling of fingers and toes</text><text x="136.44" y="198.71" font-size="11.5" fill="#a3adba">Platelets rise</text><circle cx="120.44" cy="227.38" r="6" fill="#47231f" stroke="#f0705f" stroke-width="2"/><text x="104.44" y="231.58" font-size="12" fill="#a3adba" text-anchor="end" font-weight="700">Weeks 2–4</text><text x="136.44" y="232.06" font-size="12.5" fill="#e8ecf1" font-weight="700">Coronary aneurysms</text><text x="136.44" y="248.71" font-size="11.5" fill="#a3adba">Highest risk of thrombosis</text><circle cx="120.44" cy="277.38" r="6" fill="#1e3447" stroke="#5aa9e6" stroke-width="2"/><text x="104.44" y="281.58" font-size="12" fill="#a3adba" text-anchor="end" font-weight="700">Weeks 6–8</text><text x="136.44" y="282.06" font-size="12.5" fill="#e8ecf1" font-weight="700">Repeat echocardiogram</text><text x="136.44" y="298.71" font-size="11.5" fill="#a3adba">Stop aspirin if the coronaries are normal</text></g></svg>