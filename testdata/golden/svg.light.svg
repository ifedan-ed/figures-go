<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 277.95" width="400" height="277.95" role="img" aria-label="How a loop diuretic works" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, &#39;Helvetica Neue&#39;, Arial, sans-serif"><title>How a loop diuretic works</title><desc>In the thick ascending limb, furosemide blocks the NKCC2 co-transporter on the luminal side, so sodium, potassium and chloride stay in the tubule and water follows them into the urine.</desc><rect x="0" y="0" width="400" height="277.95" fill="#ffffff"/><text x="14" y="28.63" font-size="15" fill="#1d232b" font-weight="700">How a loop diuretic works</text><g transform="translate(0 40.75)"><defs><clipPath id="ff-light-clip"><rect x="0" y="0" width="400" height="240"/></clipPath></defs><g transform="translate(14 0) scale(0.93000) translate(0 0)" clip-path="url(#ff-light-clip)" fill="#1d232b"><defs><marker id="ff-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d232b"/></marker></defs><rect x="8" y="30" width="112" height="196" rx="10" fill="#cfe6f5"/><text x="64" y="52" font-size="13" font-weight="700" text-anchor="middle">Tubule lumen</text><rect x="130" y="30" width="150" height="196" rx="14" fill="#f4f6f9" stroke="#9aa5b4"/><text x="205" y="52" font-size="13" font-weight="700" text-anchor="middle">TAL cell</text><rect x="290" y="30" width="102" height="196" rx="10" fill="#f8d9d5"/><text x="341" y="52" font-size="13" font-weight="700" text-anchor="middle">Blood</text><text x="64" y="104" font-size="12" text-anchor="middle">Na⁺ K⁺ 2Cl⁻</text><line x1="22" y1="122" x2="106" y2="122" stroke="#1d232b" stroke-width="2" marker-end="url(#ff-a)"/><circle cx="130" cy="122" r="18" fill="#d6e6f5" stroke="#1f6fb2" stroke-width="2.5"/><path d="M117 109L143 135M143 109L117 135" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/><text x="130" y="158" font-size="12" text-anchor="middle">NKCC2</text><line x1="152" y1="122" x2="282" y2="122" stroke="#5b6573" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ff-a)"/><text x="215" y="96" font-size="13" font-weight="700" fill="#c0392b" text-anchor="middle">Furosemide</text><text x="215" y="112" font-size="12" fill="#c0392b" text-anchor="middle">blocks uptake</text><text x="64" y="194" font-size="12" text-anchor="middle">Na⁺ and water</text><text x="64" y="210" font-size="12" text-anchor="middle">stay in the urine</text></g></g></svg>