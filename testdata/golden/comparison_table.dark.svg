<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 376.38" width="400" height="376.38" role="img" aria-label="Nephritic vs nephrotic syndrome" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, &#39;Helvetica Neue&#39;, Arial, sans-serif"><title>Nephritic vs nephrotic syndrome</title><desc>Nephritic syndrome has haematuria, hypertension and mild proteinuria; nephrotic syndrome has heavy proteinuria, low albumin and marked oedema.</desc><rect x="0" y="0" width="400" height="376.38" fill="#16191e"/><text x="14" y="28.63" font-size="15" fill="#e8ecf1" font-weight="700">Nephritic vs nephrotic syndrome</text><g transform="translate(0 40.75)"><rect x="14" y="0" width="372" height="319.63" rx="8" fill="#16191e"/><path d="M22 0H378Q386 0 386 8V33.63Q386 33.63 386 33.63H14Q14 33.63 14 33.63V8Q14 0 22 0Z" fill="#2d333d" stroke-linejoin="round" stroke-linecap="round"/><path d="M14 33.63H126Q126 33.63 126 33.63V319.63Q126 319.63 126 319.63H22Q14 319.63 14 311.63V33.63Q14 33.63 14 33.63Z" fill="#22272f" stroke-linejoin="round" stroke-linecap="round"/><rect x="258" y="101.63" width="126" height="27" rx="4" fill="#47231f"/><rect x="258" y="132.63" width="126" height="42" rx="4" fill="#47231f"/><rect x="258" y="229.63" width="126" height="42" rx="4" fill="#47231f"/><line x1="14" y1="33.63" x2="386" y2="33.63" stroke="#6b7684" stroke-width="0.8" stroke-linecap="round"/><line x1="14" y1="99.63" x2="386" y2="99.63" stroke="#6b7684" stroke-width="0.8" stroke-linecap="round"/><line x1="14" y1="130.63" x2="386" y2="130.63" stroke="#6b7684" stroke-width="0.8" stroke-linecap="round"/><line x1="14" y1="176.63" x2="386" y2="176.63" stroke="#6b7684" stroke-width="0.8" stroke-linecap="round"/><line x1="14" y1="227.63" x2="386" y2="227.63" stroke="#6b7684" stroke-width="0.8" stroke-linecap="round"/><line x1="14" y1="273.63" x2="386" y2="273.63" stroke="#6b7684" stroke-width="0.8" stroke-linecap="round"/><line x1="126" y1="0" x2="126" y2="319.63" stroke="#6b7684" stroke-width="0.8" stroke-linecap="round"/><line x1="256" y1="0" x2="256" y2="319.63" stroke="#6b7684" stroke-width="0.8" stroke-linecap="round"/><rect x="14" y="0" width="372" height="319.63" rx="8" fill="none" stroke="#6b7684" stroke-width="1.2"/><text x="22" y="20.66" font-size="11" fill="#a3adba" font-weight="700">Feature</text><text x="191" y="21.19" font-size="12.5" fill="#e8ecf1" text-anchor="middle" font-weight="700">Nephritic</text><text x="321" y="21.19" font-size="12.5" fill="#e8ecf1" text-anchor="middle" font-weight="700">Nephrotic</text><text x="22" y="70.83" font-size="12" fill="#e8ecf1" font-weight="700">Haematuria</text><circle cx="191" cy="57.13" r="8" fill="#173a26" stroke="#4cc47f" stroke-width="1"/><polyline points="187.2,57.33 190,60.13 195,54.13" fill="none" stroke="#4cc47f" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/><text x="191" y="80.83" font-size="12" fill="#e8ecf1" text-anchor="middle">Red cell casts</text><circle cx="321" cy="49.63" r="8" fill="#3f3215" stroke="#e7ad3c" stroke-width="1"/><path d="M316.8 50.63C318.5 47.03 320.5 48.23 321 49.63C321.5 51.03 323.5 52.23 325.2 48.63" fill="none" stroke="#e7ad3c" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/><text x="321" y="73.33" font-size="12" fill="#e8ecf1" text-anchor="middle">Microscopic,</text><text x="321" y="88.33" font-size="12" fill="#e8ecf1" text-anchor="middle">at most</text><text x="22" y="119.33" font-size="12" fill="#e8ecf1" font-weight="700">Proteinuria</text><text x="191" y="119.33" font-size="12" fill="#e8ecf1" text-anchor="middle">Mild to moderate</text><text x="321" y="119.33" font-size="12" fill="#e8ecf1" text-anchor="middle">Over 40 mg/m²/h</text><text x="22" y="157.82" font-size="12" fill="#e8ecf1" font-weight="700">Oedema</text><text x="191" y="157.82" font-size="12" fill="#e8ecf1" text-anchor="middle">Mild, periorbital</text><text x="321" y="150.32" font-size="12" fill="#e8ecf1" text-anchor="middle">Marked,</text><text x="321" y="165.33" font-size="12" fill="#e8ecf1" text-anchor="middle">generalised</text><text x="22" y="206.33" font-size="12" fill="#e8ecf1" font-weight="700">Hypertension</text><circle cx="191" cy="202.13" r="8" fill="#173a26" stroke="#4cc47f" stroke-width="1"/><polyline points="187.2,202.33 190,205.13 195,199.13" fill="none" stroke="#4cc47f" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/><circle cx="321" cy="192.63" r="8" fill="#47231f" stroke="#f0705f" stroke-width="1"/><line x1="318" y1="189.63" x2="324" y2="195.63" stroke="#f0705f" stroke-width="1.9" stroke-linecap="round"/><line x1="318" y1="195.63" x2="324" y2="189.63" stroke="#f0705f" stroke-width="1.9" stroke-linecap="round"/><text x="321" y="216.33" font-size="12" fill="#e8ecf1" text-anchor="middle">Usually normal</text><text x="22" y="254.83" font-size="12" fill="#e8ecf1" font-weight="700">Serum albumin</text><text x="191" y="247.33" font-size="12" fill="#e8ecf1" text-anchor="middle">Normal or</text><text x="191" y="262.33" font-size="12" fill="#e8ecf1" text-anchor="middle">slightly low</text><text x="321" y="254.83" font-size="12" fill="#e8ecf1" text-anchor="middle">Below 25 g/L</text><text x="22" y="300.83" font-size="12" fill="#e8ecf1" font-weight="700">Typical cause</text><text x="191" y="293.33" font-size="12" fill="#e8ecf1" text-anchor="middle">Post-streptococcal</text><text x="191" y="308.33" font-size="12" fill="#e8ecf1" text-anchor="middle">GN</text><text x="321" y="293.33" font-size="12" fill="#e8ecf1" text-anchor="middle">Minimal change</text><text x="321" y="308.33" font-size="12" fill="#e8ecf1" text-anchor="middle">disease</text></g></svg>