<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 322.25" width="400" height="322.25" role="img" aria-label="WHO fast-breathing thresholds by age" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, &#39;Helvetica Neue&#39;, Arial, sans-serif"><title>WHO fast-breathing thresholds by age</title><desc>Bar chart of the respiratory rate at or above which breathing counts as fast: 60 breaths a minute under 2 months, 50 from 2 to 11 months, and 40 from 1 to 5 years.</desc><rect x="0" y="0" width="400" height="322.25" fill="#ffffff"/><text x="14" y="28.63" font-size="15" fill="#1d232b" font-weight="700">WHO fast-breathing thresholds by age</text><g transform="translate(0 40.75)"><text x="14" y="11.2" font-size="12" fill="#5b6573">Respiratory rate (breaths/min)</text><line x1="33.84" y1="192" x2="386" y2="192" stroke="#e3e7ed" stroke-width="1"/><line x1="33.84" y1="164" x2="386" y2="164" stroke="#e3e7ed" stroke-width="1"/><line x1="33.84" y1="136" x2="386" y2="136" stroke="#e3e7ed" stroke-width="1"/><line x1="33.84" y1="108" x2="386" y2="108" stroke="#e3e7ed" stroke-width="1"/><line x1="33.84" y1="80" x2="386" y2="80" stroke="#e3e7ed" stroke-width="1"/><line x1="33.84" y1="52" x2="386" y2="52" stroke="#e3e7ed" stroke-width="1"/><line x1="33.84" y1="24" x2="386" y2="24" stroke="#e3e7ed" stroke-width="1"/><text x="26.84" y="223.85" font-size="11" fill="#5b6573" text-anchor="end">0</text><text x="26.84" y="195.85" font-size="11" fill="#5b6573" text-anchor="end">10</text><text x="26.84" y="167.85" font-size="11" fill="#5b6573" text-anchor="end">20</text><text x="26.84" y="139.85" font-size="11" fill="#5b6573" text-anchor="end">30</text><text x="26.84" y="111.85" font-size="11" fill="#5b6573" text-anchor="end">40</text><text x="26.84" y="83.85" font-size="11" fill="#5b6573" text-anchor="end">50</text><text x="26.84" y="55.85" font-size="11" fill="#5b6573" text-anchor="end">60</text><text x="26.84" y="27.85" font-size="11" fill="#5b6573" text-anchor="end">70</text><text x="92.54" y="237.73" font-size="11" fill="#1d232b" text-anchor="middle">Under 2 months</text><text x="209.92" y="237.73" font-size="11" fill="#1d232b" text-anchor="middle">2–11 months</text><text x="327.31" y="237.73" font-size="11" fill="#1d232b" text-anchor="middle">1–5 years</text><line x1="33.84" y1="220" x2="386" y2="220" stroke="#9aa5b4" stroke-width="1" stroke-linecap="round"/><rect x="60.54" y="52" width="64" height="168" fill="#1f6fb2"/><text x="92.54" y="47.85" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700" stroke="#ffffff" stroke-width="3.08" stroke-linejoin="round">60</text><text x="92.54" y="47.85" font-size="11" fill="#1d232b" text-anchor="middle" font-weight="700">60</text><rect x="177.92" y="80" width="64" height="140" fill="#1f6fb2"/><text x="209.92" y="75.85" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700" stroke="#ffffff" stroke-width="3.08" stroke-linejoin="round">50</text><text x="209.92" y="75.85" font-size="11" fill="#1d232b" text-anchor="middle" font-weight="700">50</text><rect x="295.31" y="108" width="64" height="112" fill="#1f6fb2"/><text x="327.31" y="103.85" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700" stroke="#ffffff" stroke-width="3.08" stroke-linejoin="round">40</text><text x="327.31" y="103.85" font-size="11" fill="#1d232b" text-anchor="middle" font-weight="700">40</text></g><text x="14" y="305.23" font-size="11" fill="#5b6573">WHO IMCI thresholds for fast breathing.</text></svg>