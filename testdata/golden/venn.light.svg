<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 451.07" width="400" height="451.07" role="img" aria-label="Kawasaki disease, MIS-C and toxic shock" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, &#39;Helvetica Neue&#39;, Arial, sans-serif"><title>Kawasaki disease, MIS-C and toxic shock</title><desc>All three cause fever and rash. Kawasaki disease and MIS-C share conjunctivitis and mucositis; MIS-C and toxic shock share shock and GI symptoms. Coronary aneurysms are typical of Kawasaki disease, recent SARS-CoV-2 of MIS-C, and a toxin-producing infection of toxic shock.</desc><rect x="0" y="0" width="400" height="451.07" fill="#ffffff"/><text x="14" y="28.63" font-size="15" fill="#1d232b" font-weight="700">Kawasaki disease, MIS-C and toxic shock</text><g transform="translate(0 40.75)"><circle cx="134" cy="140" r="114" fill="#1f6fb2" fill-opacity="0.13"/><circle cx="266" cy="140" r="114" fill="#d55e00" fill-opacity="0.13"/><circle cx="200" cy="254.32" r="114" fill="#008a63" fill-opacity="0.13"/><circle cx="134" cy="140" r="114" fill="none" stroke="#1f6fb2" stroke-width="1.8"/><circle cx="266" cy="140" r="114" fill="none" stroke="#d55e00" stroke-width="1.8"/><circle cx="200" cy="254.32" r="114" fill="none" stroke="#008a63" stroke-width="1.8"/><text x="134" y="15.55" font-size="13" fill="#1f6fb2" text-anchor="middle" font-weight="700">Kawasaki disease</text><text x="266" y="15.55" font-size="13" fill="#d55e00" text-anchor="middle" font-weight="700">MIS-C</text><text x="200" y="386.87" font-size="13" fill="#008a63" text-anchor="middle" font-weight="700">Toxic shock</text><text x="90.03" y="113.21" font-size="11.5" fill="#1d232b" text-anchor="middle">Coronary aneurysms</text><text x="90.03" y="131.59" font-size="11.5" fill="#1d232b" text-anchor="middle">Under 5 years</text><text x="309.37" y="113.21" font-size="11.5" fill="#1d232b" text-anchor="middle">Recent SARS-CoV-2</text><text x="309.37" y="131.59" font-size="11.5" fill="#1d232b" text-anchor="middle">Older children</text><text x="200.35" y="302.21" font-size="11.5" fill="#1d232b" text-anchor="middle">Staph or strep toxin</text><text x="199.17" y="98.21" font-size="11.5" fill="#1d232b" text-anchor="middle">Conjuncti-</text><text x="199.17" y="112.59" font-size="11.5" fill="#1d232b" text-anchor="middle">vitis</text><text x="199.17" y="130.96" font-size="11.5" fill="#1d232b" text-anchor="middle">Mucositis</text><text x="263.82" y="209.21" font-size="11.5" fill="#1d232b" text-anchor="middle">Shock</text><text x="263.82" y="227.59" font-size="11.5" fill="#1d232b" text-anchor="middle">GI upset</text><text x="138.14" y="218.21" font-size="11.5" fill="#1d232b" text-anchor="middle">Peeling</text><text x="199.43" y="173.21" font-size="11.5" fill="#1d232b" text-anchor="middle">Fever</text><text x="199.43" y="191.59" font-size="11.5" fill="#1d232b" text-anchor="middle">Rash</text></g></svg>